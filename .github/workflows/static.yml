# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs after Semantic Release completes successfully on main
  workflow_run:
    workflows: ["Semantic Release"]
    branches: [main]
    types: [completed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Le site ne sert pas tout le dépôt : on copie dans _site ce qui est réellement chargé et on laisse de côté les sources de
      # génération (séquences vidéo et images intermédiaires des ultimes de match3-quest, ≈ 1,1 Go, que seuls les outils lisent),
      # les outils, les tests et la documentation. Le jeu ne charge que sprites/ultimates (voir tools/precache-manifest.mjs).
      - name: Build site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude='/_site' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='test-results' \
            --exclude='/match3-quest/sprites/ultimates-seq' --exclude='/match3-quest/sprites/ultimates-comfy' \
            --exclude='/match3-quest/sprites/ultimates-sdxl' --exclude='/match3-quest/sprites/house/cand' \
            --exclude='/match3-quest/tools' --exclude='/match3-quest/tests' --exclude='/match3-quest/docs'
          du -sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

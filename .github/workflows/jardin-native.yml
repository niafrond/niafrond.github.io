name: Jardin natif

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'jardin-native/**'
      - '.github/workflows/jardin-native.yml'

jobs:
  core:
    name: Jardin natif - noyau (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Tests du noyau
        working-directory: jardin-native
        run: gradle :core:test --no-daemon

  apk:
    name: Jardin natif - APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Assembler l'APK debug
        working-directory: jardin-native
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jardin-natif-debug
          path: jardin-native/app/build/outputs/apk/debug/*.apk

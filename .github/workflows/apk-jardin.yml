name: Build Jardin APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'jardin/**'
      - 'jardin-android/**'
      - '.github/workflows/apk-jardin.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Jardin APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASS: ${{ secrets.JARDIN_KEYSTORE_PASSWORD || 'jardin_ci_build' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor
        working-directory: jardin-android
        run: npm install

      - name: Add Android platform
        working-directory: jardin-android
        run: npx cap add android

      - name: Copy web assets
        working-directory: jardin-android
        run: |
          npx cap sync android
          # Les tests unitaires n'ont rien à faire dans l'APK
          rm -rf android/app/src/main/assets/public/tests
          # La vue 3D est réservée au PC (three.js ≈ 0,7 Mo) : absente de l'APK
          rm -rf android/app/src/main/assets/public/vendor/three

      - name: Android 13 minimum et icône de notification
        run: |
          VARS="jardin-android/android/variables.gradle"
          sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 33/" "$VARS"
          DRAWABLE_DIR="jardin-android/android/app/src/main/res/drawable"
          mkdir -p "$DRAWABLE_DIR"
          cp jardin-android/src/main/res/drawable/ic_stat_jardin.xml "$DRAWABLE_DIR/"

      - name: Patch AndroidManifest (notifications, alarmes exactes, portrait)
        env:
          MANIFEST: jardin-android/android/app/src/main/AndroidManifest.xml
        shell: python3 {0}
        run: |
          import os, xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ET.register_namespace('tools', 'http://schemas.android.com/tools')
          NS = 'http://schemas.android.com/apk/res/android'
          A = lambda n: f'{{{NS}}}{n}'
          tree = ET.parse(os.environ['MANIFEST'])
          root = tree.getroot()
          existing = {e.get(A('name')) for e in root.findall('uses-permission')}
          children = list(root)
          idx = next(i for i, c in enumerate(children) if c.tag == 'application')
          n = 0
          for p in ['android.permission.POST_NOTIFICATIONS',
                    'android.permission.SCHEDULE_EXACT_ALARM',
                    'android.permission.RECEIVE_BOOT_COMPLETED',
                    'android.permission.ACCESS_FINE_LOCATION',
                    'android.permission.ACCESS_COARSE_LOCATION',
                    'android.permission.INTERNET']:
              if p in existing: continue
              el = ET.Element('uses-permission'); el.set(A('name'), p)
              children.insert(idx + n, el); n += 1
          root[:] = children
          def add_filter(act, scheme, host, path_prefix=None):
              f = ET.SubElement(act, 'intent-filter')
              ET.SubElement(f, 'action').set(A('name'), 'android.intent.action.VIEW')
              for cat in ('android.intent.category.DEFAULT', 'android.intent.category.BROWSABLE'):
                  ET.SubElement(f, 'category').set(A('name'), cat)
              d = ET.SubElement(f, 'data')
              d.set(A('scheme'), scheme); d.set(A('host'), host)
              if path_prefix: d.set(A('pathPrefix'), path_prefix)
          for act in root.iter('activity'):
              act.set(A('screenOrientation'), 'portrait')
              # liens de transfert : jardin://import/<code> et https://niafrond.github.io/jardin/… (sans autoVerify)
              act.set(A('launchMode'), 'singleTask')
              add_filter(act, 'jardin', 'import')
              add_filter(act, 'https', 'niafrond.github.io', '/jardin')
          ET.indent(tree, space='    ')
          tree.write(os.environ['MANIFEST'], encoding='unicode', xml_declaration=True)

      - name: Set app version
        run: |
          read -r VERSION VERSION_CODE < <(node -e "
            const c = require('fs').readFileSync('version.js','utf8');
            const m = c.match(/major:\s*(\d+),\s*minor:\s*(\d+),\s*patch:\s*(\d+)/);
            const [,maj,min,pat] = m;
            process.stdout.write(maj+'.'+min+'.'+pat+' '+(Number(maj)*1000000+Number(min)*1000+Number(pat))+'\n');
          ")
          GRADLE="jardin-android/android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"

      - name: Install ImageMagick
        run: |
          command -v convert && exit 0
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin

      - name: Set app icons
        run: |
          RES="jardin-android/android/app/src/main/res"
          convert -background none jardin/icon.svg -resize 512x512 /tmp/icon-512.png
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${entry%%:*}"; s="${entry##*:}"
            convert /tmp/icon-512.png -resize "${s}x${s}" "$RES/mipmap-$d/ic_launcher.png"
            convert /tmp/icon-512.png -resize "${s}x${s}" "$RES/mipmap-$d/ic_launcher_round.png"
          done
          for entry in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            d="${entry%%:*}"; s="${entry##*:}"
            for ext in png webp; do
              fg="$RES/mipmap-$d/ic_launcher_foreground.$ext"
              if [ -f "$fg" ]; then convert /tmp/icon-512.png -resize "${s}x${s}" "$fg"; fi
            done
          done

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Restore or generate keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JARDIN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > jardin-android/jardin.keystore
          else
            keytool -genkeypair -v -keystore jardin-android/jardin.keystore -alias jardin \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Jardin, OU=App, O=Niafrond, L=FR, S=FR, C=FR" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS"
          fi

      - name: Build release APK
        working-directory: jardin-android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"
          apksigner sign --ks jardin-android/jardin.keystore --ks-key-alias jardin \
            --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$KEYSTORE_PASS" \
            --out jardin-android/android/app/build/outputs/apk/release/jardin.apk \
            jardin-android/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jardin-apk
          path: jardin-android/android/app/build/outputs/apk/release/jardin.apk
          retention-days: 30

      - name: Publish APK to rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-jardin"
          APK="jardin-android/android/app/build/outputs/apk/release/jardin.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Jardin APK"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false --title "Jardin APK" --notes "APK Jardin"
          fi
          gh release upload "$TAG" "$APK#jardin.apk" --clobber

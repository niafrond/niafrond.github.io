<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Plex Mobile</title>
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle">Plex</h1>
    <button id="refreshBtn" class="icon-btn" aria-label="Actualiser">⟳</button>
  </header>

  <nav id="libraryTabs" class="tabs" hidden></nav>

  <main id="app">
    <div id="statusBanner" class="status-banner" hidden></div>
    <div id="grid" class="grid"></div>
  </main>

  <div id="detailView" class="sheet" hidden>
    <div class="sheet-inner">
      <button id="closeDetailBtn" class="icon-btn sheet-close" aria-label="Fermer">✕</button>
      <div id="detailArt" class="detail-art"></div>
      <div class="detail-body">
        <h2 id="detailTitle"></h2>
        <p id="detailMeta" class="detail-meta"></p>
        <p id="detailSummary" class="detail-summary"></p>
        <button id="playBtn" class="btn-primary">▶ Lire</button>
        <div id="episodeList" class="episode-list"></div>
      </div>
    </div>
  </div>

  <div id="playerView" class="player" hidden>
    <video id="video" playsinline controls autoplay></video>
    <button id="closePlayerBtn" class="icon-btn player-close" aria-label="Fermer le lecteur">✕</button>
  </div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Plex Mobile</title>
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle">Plex</h1>
    <button id="refreshBtn" class="icon-btn" aria-label="Actualiser">⟳</button>
    <button id="settingsBtn" class="icon-btn" aria-label="Réglages">⚙</button>
  </header>

  <nav id="libraryTabs" class="tabs" hidden></nav>

  <main id="app">
    <div id="statusBanner" class="status-banner" hidden></div>
    <div id="grid" class="grid"></div>
  </main>

  <div id="detailView" class="sheet" hidden>
    <div class="sheet-inner">
      <button id="closeDetailBtn" class="icon-btn sheet-close" aria-label="Fermer">✕</button>
      <div id="detailArt" class="detail-art"></div>
      <div class="detail-body">
        <h2 id="detailTitle"></h2>
        <p id="detailMeta" class="detail-meta"></p>
        <p id="detailSummary" class="detail-summary"></p>
        <button id="playBtn" class="btn-primary">▶ Lire</button>
        <div id="episodeList" class="episode-list"></div>
      </div>
    </div>
  </div>

  <div id="playerView" class="player" hidden>
    <video id="video" playsinline controls autoplay></video>
    <button id="closePlayerBtn" class="icon-btn player-close" aria-label="Fermer le lecteur">✕</button>
  </div>

  <div id="settingsView" class="sheet" hidden>
    <div class="sheet-inner">
      <button id="closeSettingsBtn" class="icon-btn sheet-close" aria-label="Fermer">✕</button>
      <div class="detail-body">
        <h2>Connexion à Plex</h2>
        <p class="detail-meta">Ce token et cette adresse restent uniquement dans le navigateur de ce téléphone (localStorage) — rien n'est envoyé ailleurs qu'à plex.tv et à ton serveur.</p>

        <label class="field-label" for="tokenInput">X-Plex-Token</label>
        <input id="tokenInput" type="text" class="field-input" placeholder="Colle ton token Plex ici" autocomplete="off" autocapitalize="off" spellcheck="false">

        <label class="field-label" for="serverInput">Adresse du serveur (optionnel)</label>
        <input id="serverInput" type="text" class="field-input" placeholder="Laisser vide = détection automatique via plex.tv" autocomplete="off" autocapitalize="off" spellcheck="false">

        <button id="connectBtn" class="btn-primary">Se connecter</button>
        <button id="forgetBtn" class="btn-secondary">Oublier ce token</button>
        <p id="settingsStatus" class="detail-meta"></p>
      </div>
    </div>
  </div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoké — Écran vidéo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #player-wrap, #player-wrap iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      background: #000;
      color: #e5e7eb;
      z-index: 10;
      padding: 24px;
    }
    .overlay h1 { font-size: 2rem; margin: 0; }
    #start-btn {
      border: 0;
      border-radius: 14px;
      padding: 18px 32px;
      font-size: 1.3rem;
      font-weight: 700;
      background: #22c55e;
      color: #06220f;
      cursor: pointer;
    }
    #start-btn:hover { background: #16a34a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="player-wrap"><div id="player"></div></div>

  <div id="start-overlay" class="overlay">
    <h1>🎤 Karaoké</h1>
    <button id="start-btn" type="button">Démarrer</button>
  </div>

  <div id="waiting-overlay" class="overlay" hidden>
    <h1>🎶 En attente</h1>
  </div>

  <script src="state.js"></script>
  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const waitingOverlay = document.getElementById('waiting-overlay');

    let ytPlayer = null;
    let ytReady = false;
    let started = false;
    let loadedQueueItemId = null;
    let stallTimer = null;

    // Pour certaines vidéos, YouTube reste bloqué en boucle de retry interne
    // (essais successifs de plusieurs clients internes) sans jamais déclencher
    // onError côté API JS — la file resterait alors bloquée indéfiniment sur
    // cette chanson. Ce filet de sécurité saute la chanson si la lecture n'a
    // toujours pas démarré après STALL_TIMEOUT_MS.
    const STALL_TIMEOUT_MS = 15000;

    function clearStallTimer() {
      if (stallTimer) {
        clearTimeout(stallTimer);
        stallTimer = null;
      }
    }

    function armStallTimer(trackId) {
      clearStallTimer();
      stallTimer = setTimeout(() => {
        if (loadedQueueItemId === trackId) advanceQueue();
      }, STALL_TIMEOUT_MS);
    }

    function currentTrack() {
      const state = KaraokeState.load();
      return state.queue[0] || null;
    }

    function showWaiting() {
      waitingOverlay.hidden = false;
    }

    function hideWaiting() {
      waitingOverlay.hidden = true;
    }

    // cc_load_policy:0 empêche seulement l'AFFICHAGE auto des sous-titres ;
    // si l'utilisateur a forcé les sous-titres dans ses réglages YouTube, ils
    // reviennent quand même. unloadModule('captions') les désactive pour de
    // vrai, mais il faut le rappeler après chaque nouvelle vidéo chargée.
    function disableCaptions() {
      ytPlayer.unloadModule('captions');
    }

    function playTrack(track) {
      loadedQueueItemId = track.id;
      hideWaiting();
      if (ytPlayer && ytReady) {
        ytPlayer.loadVideoById(track.videoId);
        disableCaptions();
        armStallTimer(track.id);
      }
    }

    // Recale l'écran vidéo sur la tête de file courante : démarre une
    // nouvelle vidéo si la tête de file a changé (ajout initial, skip ou
    // suppression faits depuis l'écran de contrôle), sinon ne touche à rien.
    function syncToQueue() {
      const track = currentTrack();
      if (!track) {
        loadedQueueItemId = null;
        showWaiting();
        return;
      }
      if (track.id === loadedQueueItemId) return;
      playTrack(track);
    }

    // Retire la chanson qui vient de se terminer, mais seulement si elle est
    // toujours en tête de file : si l'écran de contrôle l'a déjà retirée
    // (ex. "Passer" cliqué juste avant), ce ENDED devient un no-op au lieu de
    // faire avancer la file une deuxième fois.
    function advanceQueue() {
      clearStallTimer();
      KaraokeState.removeIfCurrent(loadedQueueItemId);
      syncToQueue();
    }

    function onPlayerReady() {
      ytReady = true;
      disableCaptions();
      syncToQueue();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) advanceQueue();
    }

    function onPlayerError() {
      // Vidéo indisponible/retirée : on passe à la suivante plutôt que de
      // rester bloqué sur une chanson qui ne se lancera jamais.
      advanceQueue();
    }

    function createYouTubePlayer() {
      ytPlayer = new YT.Player('player', {
        playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, fs: 0, cc_load_policy: 0 },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    }

    window.onYouTubeIframeAPIReady = createYouTubePlayer;

    function loadYouTubeIframeApi() {
      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(script);
    }

    startBtn.addEventListener('click', () => {
      if (started) return;
      started = true;
      startOverlay.hidden = true;
      showWaiting();
      loadYouTubeIframeApi();
    });

    KaraokeState.subscribe(() => {
      if (started) syncToQueue();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoké Playlist</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --panel-border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --panel-border: #e5e7eb;
        --text: #111827;
        --muted: #4b5563;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .subtitle { margin: 0 0 16px; color: var(--muted); }
    h2.section-title { font-size: 1.1rem; margin: 28px 0 10px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
    }
    .stack { display: grid; gap: 12px; }
    label { font-size: 0.92rem; font-weight: 600; }
    input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      padding: 10px 12px;
      background: transparent;
      color: inherit;
      font-size: 0.98rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #06220f; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--panel-border);
    }
    .status { margin-top: 10px; color: var(--muted); min-height: 1.2em; }
    .status.error { color: var(--danger); }
    .results { margin-top: 18px; display: grid; gap: 10px; }
    .item {
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: 132px 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .thumb {
      width: 132px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      background: #000;
    }
    .meta h2 { margin: 0 0 6px; font-size: 1rem; }
    .meta p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .add-btn {
      background: #ef4444;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      border: 0;
      cursor: pointer;
      display: inline-block;
    }
    .add-btn:hover { background: #dc2626; }
    .add-btn:disabled { background: #6b7280; cursor: default; }
    .playlist-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .playlist-count { color: var(--muted); font-size: 0.86rem; }
    .playlist-empty { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
    .item.playlist-item { grid-template-columns: 88px 1fr; }
    .item.playlist-item .thumb { width: 88px; }
    @media (max-width: 740px) {
      .item { grid-template-columns: 1fr; }
      .thumb { width: 100%; }
      .add-btn { justify-self: start; }
      .item.playlist-item .thumb { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>🎤 Karaoke Playlist</h1>
    <p class="subtitle">Recherche YouTube suffixée automatiquement avec « karaoké ».</p>

    <section id="api-key-panel" class="panel stack">
      <div>
        <label for="api-key-input">Clé API YouTube Data v3</label>
        <input id="api-key-input" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
      </div>
      <div class="actions">
        <button id="api-key-save-btn" class="btn-primary" type="button">Enregistrer</button>
      </div>
      <p id="api-key-status" class="status"></p>
    </section>

    <section class="panel stack">
      <div>
        <label for="query">Titre à rechercher</label>
        <input id="query" type="text" placeholder="Ex: Céline Dion - Pour que tu m'aimes encore">
      </div>

      <div class="actions">
        <button id="search-btn" class="btn-primary" type="button">Rechercher</button>
        <button id="open-playlist-btn" class="btn-ghost" type="button">Ouvrir la playlist</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <h2 class="section-title">🎶 Contenu de la playlist</h2>
    <section class="panel">
      <div class="playlist-header">
        <span class="playlist-count" id="playlist-count">0 chanson</span>
        <span class="playlist-count" id="playlist-updated"></span>
      </div>
      <p id="playlist-status" class="status"></p>
      <div id="playlist-results" class="results" aria-live="polite"></div>
      <p id="playlist-empty" class="playlist-empty">Playlist vide.</p>
    </section>
  </main>

  <script>
    const API_KEY_STORAGE = 'karaoke_playlist_youtube_api_key';
    // Un client ID OAuth n'est pas un secret (restreint côté Google par les
    // origines JS autorisées), donc pas de souci à le mettre en dur ici.
    const OAUTH_CLIENT_ID = '24444358834-964b8m9levaivpbmn1p7do47gt5dtq64.apps.googleusercontent.com';
    const YOUTUBE_WRITE_SCOPE = 'https://www.googleapis.com/auth/youtube';
    const PLAYLIST_ID = 'PLLQS1xvNdx2M';
    const PLAYLIST_BASE_URL = `https://www.youtube.com/playlist?list=${PLAYLIST_ID}`;
    const PLAYLIST_REFRESH_MS = 20000;
    const POST_ADD_REFRESH_DELAY_MS = 2000;

    const queryInput = document.getElementById('query');
    const searchBtn = document.getElementById('search-btn');
    const openPlaylistBtn = document.getElementById('open-playlist-btn');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');
    const playlistResultsEl = document.getElementById('playlist-results');
    const playlistCountEl = document.getElementById('playlist-count');
    const playlistUpdatedEl = document.getElementById('playlist-updated');
    const playlistStatusEl = document.getElementById('playlist-status');
    const playlistEmptyEl = document.getElementById('playlist-empty');

    const apiKeyPanel = document.getElementById('api-key-panel');
    const apiKeyInput = document.getElementById('api-key-input');
    const apiKeySaveBtn = document.getElementById('api-key-save-btn');
    const apiKeyStatusEl = document.getElementById('api-key-status');

    function getYoutubeApiKey() {
      return (localStorage.getItem(API_KEY_STORAGE) || '').trim();
    }

    // Le champ n'est affiché que quand aucune clé valide n'est connue : masqué
    // dès qu'une clé stockée fonctionne, ré-affiché si un appel échoue pour une
    // raison liée à la clé (400/403 — clé absente, malformée ou refusée).
    function showApiKeyPanel(message = '', isError = false) {
      apiKeyInput.value = getYoutubeApiKey();
      apiKeyPanel.hidden = false;
      apiKeyStatusEl.textContent = message;
      apiKeyStatusEl.classList.toggle('error', isError);
    }

    function hideApiKeyPanel() {
      apiKeyPanel.hidden = true;
    }

    // 400/403 ne signifient pas forcément une clé invalide (ex: quotaExceeded
    // est un 403 mais la clé est parfaitement valide) — on n'inspecte le champ
    // `reason`/`message` de l'erreur que pour les cas réellement liés à la clé,
    // pour éviter de ré-afficher le champ à tort une fois la clé enregistrée.
    function isApiKeyRelatedError(status, body) {
      if (status !== 400 && status !== 403) return false;
      const reason = String(body?.error?.errors?.[0]?.reason || '').toLowerCase();
      const message = String(body?.error?.message || '').toLowerCase();
      if (reason.includes('key')) return true;
      return message.includes('api key');
    }

    apiKeySaveBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        apiKeyStatusEl.textContent = 'Saisis une clé API.';
        apiKeyStatusEl.classList.add('error');
        return;
      }
      localStorage.setItem(API_KEY_STORAGE, key);
      hideApiKeyPanel();
      fetchPlaylistContents();
    });

    // ── OAuth Google (ajout à la playlist) ────────────────────────────────────
    // Ajouter une vidéo à la playlist est une écriture : l'API YouTube n'accepte
    // ça qu'avec un token OAuth utilisateur (scope youtube), une simple clé API
    // ne suffit pas. OAUTH_CLIENT_ID est en dur (pas un secret, restreint côté
    // Google par les origines JS autorisées) ; le token d'accès lui-même n'est
    // jamais stocké — obtenu à la demande via Google Identity Services et gardé
    // en mémoire le temps de la session.
    let tokenClient = null;
    let cachedAccessToken = '';
    let cachedAccessTokenExpiresAt = 0;

    function loadGoogleIdentityServices() {
      if (window.google?.accounts?.oauth2) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.async = true;
        script.defer = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('Impossible de charger Google Identity Services'));
        document.head.appendChild(script);
      });
    }

    function isAccessTokenValid() {
      return Boolean(cachedAccessToken) && Date.now() < cachedAccessTokenExpiresAt;
    }

    async function getAccessToken() {
      if (isAccessTokenValid()) return cachedAccessToken;

      await loadGoogleIdentityServices();
      if (!tokenClient) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: OAUTH_CLIENT_ID,
          scope: YOUTUBE_WRITE_SCOPE,
          callback: () => {},
        });
      }

      return new Promise((resolve, reject) => {
        tokenClient.callback = (response) => {
          if (response.error) {
            reject(new Error(response.error_description || response.error));
            return;
          }
          cachedAccessToken = response.access_token;
          cachedAccessTokenExpiresAt = Date.now() + (Number(response.expires_in) || 3600) * 1000 - 60_000;
          resolve(cachedAccessToken);
        };
        tokenClient.error_callback = (err) => reject(new Error(err?.message || 'Connexion Google annulée'));
        tokenClient.requestAccessToken({ prompt: '' });
      });
    }

    async function addTrackToPlaylist(videoId, buttonEl) {
      const originalLabel = buttonEl.textContent;
      buttonEl.disabled = true;
      buttonEl.textContent = 'Ajout…';

      try {
        const accessToken = await getAccessToken();
        const response = await fetch('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${accessToken}`,
          },
          body: JSON.stringify({
            snippet: {
              playlistId: PLAYLIST_ID,
              resourceId: { kind: 'youtube#video', videoId },
            },
          }),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => null);
          if (response.status === 401) cachedAccessToken = '';
          throw new Error(body?.error?.message || `HTTP ${response.status}`);
        }

        buttonEl.textContent = 'Ajouté ✓';
        setTimeout(fetchPlaylistContents, POST_ADD_REFRESH_DELAY_MS);
        setTimeout(() => {
          buttonEl.disabled = false;
          buttonEl.textContent = originalLabel;
        }, 3000);
      } catch (error) {
        buttonEl.disabled = false;
        buttonEl.textContent = originalLabel;
        setStatus(`Erreur d'ajout (${error.message}).`, true);
      }
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function setPlaylistStatus(message, isError = false) {
      playlistStatusEl.textContent = message;
      playlistStatusEl.classList.toggle('error', isError);
    }

    function buildSearchQuery(rawQuery) {
      return `${rawQuery.trim()} karaoké`;
    }

    function thumbUrlFor(videoId) {
      return `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`;
    }

    function downgradeThumb(imgEl) {
      imgEl.addEventListener('error', () => {
        if (imgEl.dataset.fallback) return;
        imgEl.dataset.fallback = '1';
        imgEl.src = imgEl.src.replace('/mqdefault.jpg', '/hqdefault.jpg');
      }, { once: true });
    }

    function clearResults() {
      resultsEl.innerHTML = '';
    }

    function renderResults(items) {
      clearResults();
      if (!items.length) {
        setStatus('Aucun résultat.');
        return;
      }
      setStatus(`${items.length} résultat(s) trouvé(s).`);
      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const videoId = item?.id?.videoId;
        if (!videoId) continue;
        const title = item?.snippet?.title || 'Titre inconnu';
        const channel = item?.snippet?.channelTitle || 'Chaîne inconnue';
        const thumb = item?.snippet?.thumbnails?.medium?.url || item?.snippet?.thumbnails?.default?.url || thumbUrlFor(videoId);

        const card = document.createElement('article');
        card.className = 'item';
        const image = document.createElement('img');
        image.className = 'thumb';
        image.src = thumb;
        image.alt = '';
        downgradeThumb(image);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const titleEl = document.createElement('h2');
        titleEl.textContent = title;
        const channelEl = document.createElement('p');
        channelEl.textContent = channel;
        meta.append(titleEl, channelEl);

        const addBtn = document.createElement('button');
        addBtn.className = 'add-btn';
        addBtn.type = 'button';
        addBtn.textContent = 'Ajouter à la playlist';
        addBtn.addEventListener('click', () => addTrackToPlaylist(videoId, addBtn));

        card.append(image, meta, addBtn);
        fragment.appendChild(card);
      }
      resultsEl.appendChild(fragment);
    }

    async function searchKaraoke() {
      const apiKey = getYoutubeApiKey();
      const query = queryInput.value.trim();
      if (!apiKey) {
        showApiKeyPanel('Renseigne une clé API YouTube pour rechercher.', true);
        return;
      }
      if (!query) {
        setStatus('Saisis un titre à rechercher.', true);
        return;
      }

      clearResults();
      setStatus('Recherche en cours…');
      searchBtn.disabled = true;

      try {
        const finalQuery = buildSearchQuery(query);
        const url = new URL('https://www.googleapis.com/youtube/v3/search');
        url.searchParams.set('part', 'snippet');
        url.searchParams.set('type', 'video');
        url.searchParams.set('maxResults', '12');
        url.searchParams.set('q', finalQuery);
        url.searchParams.set('key', apiKey);

        const response = await fetch(url.toString());
        if (!response.ok) {
          const body = await response.json().catch(() => null);
          if (isApiKeyRelatedError(response.status, body)) {
            showApiKeyPanel(body?.error?.message || `Clé API refusée (HTTP ${response.status}).`, true);
            setStatus('');
            return;
          }
          throw new Error(body?.error?.message || `HTTP ${response.status}`);
        }
        const data = await response.json();
        renderResults(Array.isArray(data.items) ? data.items : []);
        hideApiKeyPanel();
      } catch (error) {
        setStatus(`Erreur de recherche (${error.message}).`, true);
      } finally {
        searchBtn.disabled = false;
      }
    }

    function renderPlaylist(items) {
      playlistResultsEl.innerHTML = '';
      playlistCountEl.textContent = `${items.length} chanson${items.length > 1 ? 's' : ''}`;
      playlistEmptyEl.style.display = items.length ? 'none' : 'block';

      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const videoId = item?.snippet?.resourceId?.videoId;
        if (!videoId) continue;
        const title = item?.snippet?.title || 'Titre inconnu';
        const channel = item?.snippet?.videoOwnerChannelTitle || item?.snippet?.channelTitle || '';
        const thumb = item?.snippet?.thumbnails?.medium?.url || item?.snippet?.thumbnails?.default?.url || thumbUrlFor(videoId);

        const card = document.createElement('article');
        card.className = 'item playlist-item';

        const image = document.createElement('img');
        image.className = 'thumb';
        image.src = thumb;
        image.alt = '';
        downgradeThumb(image);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const titleEl = document.createElement('h2');
        titleEl.textContent = title;
        const channelEl = document.createElement('p');
        channelEl.textContent = channel;
        meta.append(titleEl, channelEl);

        card.append(image, meta);
        fragment.appendChild(card);
      }
      playlistResultsEl.appendChild(fragment);
    }

    async function fetchPlaylistContents() {
      const apiKey = getYoutubeApiKey();
      if (!apiKey) {
        showApiKeyPanel('Renseigne une clé API YouTube pour charger la playlist.', true);
        return;
      }

      try {
        const allItems = [];
        let pageToken = '';
        do {
          const url = new URL('https://www.googleapis.com/youtube/v3/playlistItems');
          url.searchParams.set('part', 'snippet');
          url.searchParams.set('playlistId', PLAYLIST_ID);
          url.searchParams.set('maxResults', '50');
          url.searchParams.set('key', apiKey);
          if (pageToken) url.searchParams.set('pageToken', pageToken);

          const response = await fetch(url.toString());
          if (!response.ok) {
            const body = await response.json().catch(() => null);
            if (isApiKeyRelatedError(response.status, body)) {
              showApiKeyPanel(body?.error?.message || `Clé API refusée (HTTP ${response.status}).`, true);
              return;
            }
            throw new Error(body?.error?.message || `HTTP ${response.status}`);
          }
          const data = await response.json();
          allItems.push(...(Array.isArray(data.items) ? data.items : []));
          pageToken = data.nextPageToken || '';
        } while (pageToken);

        renderPlaylist(allItems);
        setPlaylistStatus('');
        playlistUpdatedEl.textContent = `Mis à jour à ${new Date().toLocaleTimeString('fr-FR')}`;
        hideApiKeyPanel();
      } catch (error) {
        setPlaylistStatus(`Erreur de chargement de la playlist (${error.message}).`, true);
      }
    }

    searchBtn.addEventListener('click', searchKaraoke);
    queryInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') searchKaraoke();
    });
    openPlaylistBtn.addEventListener('click', () => {
      window.open(PLAYLIST_BASE_URL, '_blank', 'noopener,noreferrer');
    });

    if (getYoutubeApiKey()) {
      hideApiKeyPanel();
    } else {
      showApiKeyPanel();
    }
    fetchPlaylistContents();
    setInterval(fetchPlaylistContents, PLAYLIST_REFRESH_MS);
  </script>
</body>
</html>

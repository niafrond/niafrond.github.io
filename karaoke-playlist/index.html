<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoké — Écran maître</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      object-fit: contain;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      background: #000;
      color: #e5e7eb;
      z-index: 10;
      padding: 24px;
    }
    .overlay h1 { font-size: 2rem; margin: 0; }
    #start-btn {
      border: 0;
      border-radius: 14px;
      padding: 18px 32px;
      font-size: 1.3rem;
      font-weight: 700;
      background: #22c55e;
      color: #06220f;
      cursor: pointer;
    }
    #start-btn:hover { background: #16a34a; }

    /* ── QR code invités : petit panneau discret, toujours visible ─────── */
    #qr-panel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      color: #e5e7eb;
      font-size: 0.78rem;
      line-height: 1.3;
    }
    #qr-code { background: #fff; padding: 8px; border-radius: 8px; line-height: 0; }
    #qr-code img, #qr-code canvas { display: block; width: 120px; height: 120px; }
    #qr-panel p { margin: 8px 0 0; max-width: 140px; }
    #qr-session-id { margin-top: 6px; font-size: 0.65rem; color: #9ca3af; word-break: break-all; user-select: all; }

    /* ── Réglages (URL/token serveur) : discret, coin opposé au QR ─────── */
    #settings-btn {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 20;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(17, 24, 39, 0.7);
      color: #e5e7eb;
      font-size: 1.05rem;
      cursor: pointer;
      opacity: 0.55;
    }
    #settings-btn:hover { opacity: 1; }
    #settings-panel {
      position: fixed;
      left: 16px;
      top: 60px;
      z-index: 25;
      width: min(320px, calc(100vw - 32px));
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 16px;
      color: #e5e7eb;
    }
    #settings-panel label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; }
    #settings-panel input {
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    #settings-panel .actions { display: flex; gap: 8px; }
    #settings-panel button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #settings-save-btn { background: #22c55e; color: #06220f; }
    #settings-close-btn { background: transparent; color: #e5e7eb; border: 1px solid rgba(255, 255, 255, 0.18) !important; }
    #settings-status { margin: 10px 0 0; font-size: 0.78rem; color: #9ca3af; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <video id="player" playsinline></video>

  <div id="start-overlay" class="overlay">
    <h1>🎤 Karaoké</h1>
    <button id="start-btn" type="button">Démarrer</button>
  </div>

  <div id="waiting-overlay" class="overlay" hidden>
    <h1>🎶 En attente</h1>
  </div>

  <div id="qr-panel" hidden>
    <div id="qr-code"></div>
    <p>Scanne pour ajouter une chanson</p>
    <div id="qr-session-id"></div>
  </div>

  <button id="settings-btn" type="button" aria-label="Réglages serveur">⚙️</button>
  <div id="settings-panel" hidden>
    <label for="settings-cdn-url-input">URL du serveur (streaming vidéo)</label>
    <input id="settings-cdn-url-input" type="text" placeholder="https://192.168.8.149:8443" autocomplete="off" spellcheck="false">
    <label for="settings-token-input">Token API</label>
    <input id="settings-token-input" type="password" autocomplete="off" spellcheck="false">
    <div class="actions">
      <button id="settings-save-btn" type="button">Enregistrer</button>
      <button id="settings-close-btn" type="button">Fermer</button>
    </div>
    <p id="settings-status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="/karaoke-playlist/state.js"></script>
  <script src="/karaoke-playlist/server-config.js"></script>
  <script type="module">
    import { watchQueue, removeQueueItem } from '/karaoke-playlist/karaoke-api.js';

    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const waitingOverlay = document.getElementById('waiting-overlay');
    const videoEl = document.getElementById('player');

    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const settingsCloseBtn = document.getElementById('settings-close-btn');
    const settingsSaveBtn = document.getElementById('settings-save-btn');
    const settingsCdnUrlInput = document.getElementById('settings-cdn-url-input');
    const settingsTokenInput = document.getElementById('settings-token-input');
    const settingsStatusEl = document.getElementById('settings-status');

    let started = false;
    let loadedQueueItemId = null;
    let stallTimer = null;
    let latestQueue = [];

    // ── Réglages (URL/token) ────────────────────────────────────────────
    function openSettings() {
      settingsCdnUrlInput.value = KaraokeServerConfig.getApiUrl();
      settingsTokenInput.value = KaraokeServerConfig.getToken();
      settingsStatusEl.textContent = '';
      settingsPanel.hidden = false;
    }

    settingsBtn.addEventListener('click', () => {
      settingsPanel.hidden ? openSettings() : (settingsPanel.hidden = true);
    });
    settingsCloseBtn.addEventListener('click', () => { settingsPanel.hidden = true; });
    settingsSaveBtn.addEventListener('click', () => {
      localStorage.setItem('karaoke_playlist_server_api_url', settingsCdnUrlInput.value.trim());
      localStorage.setItem('karaoke_playlist_server_token', settingsTokenInput.value.trim());
      settingsStatusEl.textContent = 'Enregistré ✓';
    });

    if (!KaraokeServerConfig.isConfigured()) openSettings();

    // Filet de sécurité : si le flux ne démarre jamais (fichier manquant côté
    // serveur, réseau instable) sans jamais déclencher l'event 'error', la
    // file resterait bloquée indéfiniment sur cette chanson. Désarmé dès que
    // la lecture démarre réellement (event 'playing') — sans ça il finirait
    // par couper même les vidéos qui jouent normalement.
    const STALL_TIMEOUT_MS = 15000;

    function clearStallTimer() {
      if (stallTimer) {
        clearTimeout(stallTimer);
        stallTimer = null;
      }
    }

    function armStallTimer(trackId) {
      clearStallTimer();
      stallTimer = setTimeout(() => {
        if (loadedQueueItemId === trackId) advanceQueue();
      }, STALL_TIMEOUT_MS);
    }

    function showWaiting() {
      waitingOverlay.hidden = false;
    }

    function hideWaiting() {
      waitingOverlay.hidden = true;
    }

    function streamUrlFor(cachePath) {
      const cdnUrl = KaraokeServerConfig.getCdnUrl();
      const url = new URL(`${cdnUrl}/api/video/stream`);
      url.searchParams.set('cachePath', cachePath);
      return KaraokeServerConfig.withToken(url.toString());
    }

    function playTrack(track) {
      loadedQueueItemId = track.id;
      hideWaiting();
      videoEl.src = streamUrlFor(track.cachePath);
      videoEl.play().catch(() => {});
      armStallTimer(track.id);
    }

    // Recale l'écran maître sur la tête de file courante : démarre une
    // nouvelle vidéo si la tête de file a changé (ajout, skip ou suppression
    // faits depuis n'importe quel écran invité), sinon ne touche à rien.
    function syncToQueue() {
      const track = latestQueue[0] || null;
      if (!track) {
        loadedQueueItemId = null;
        showWaiting();
        return;
      }
      if (track.id === loadedQueueItemId) return;
      playTrack(track);
    }

    // Retire la chanson qui vient de se terminer. deleteDoc est idempotent
    // (aucune erreur si déjà retirée par un invité entre-temps) : plus besoin
    // de vérifier "est-ce toujours la tête de file" comme du temps où la file
    // vivait en localStorage sur un seul PC.
    function advanceQueue() {
      clearStallTimer();
      if (loadedQueueItemId) removeQueueItem(sessionId, loadedQueueItemId);
      syncToQueue();
    }

    videoEl.addEventListener('playing', clearStallTimer);
    videoEl.addEventListener('ended', advanceQueue);
    videoEl.addEventListener('error', () => {
      // Fichier manquant/évincé du cache serveur, ou flux inaccessible : on
      // passe à la suivante plutôt que de rester bloqué.
      advanceQueue();
    });

    startBtn.addEventListener('click', () => {
      if (started) return;
      started = true;
      startOverlay.hidden = true;
      showWaiting();
      syncToQueue();
    });

    const sessionId = KaraokeState.getSessionId();

    // QR code invités : encode l'URL de l'écran invité pour la session en
    // cours. Affiché seulement si "qrcodejs" a bien chargé (CDN externe) —
    // un échec de chargement ne doit pas casser le lecteur.
    if (typeof QRCode !== 'undefined') {
      const qrPanel = document.getElementById('qr-panel');
      const guestUrl = `${location.origin}/karaoke-playlist/guest.html?session=${encodeURIComponent(sessionId)}`;
      new QRCode(document.getElementById('qr-code'), {
        text: guestUrl,
        width: 120,
        height: 120,
        colorDark: '#000000',
        colorLight: '#ffffff',
      });
      document.getElementById('qr-session-id').textContent = sessionId;
      qrPanel.hidden = false;
    }

    watchQueue(sessionId, (items) => {
      latestQueue = items;
      if (started) syncToQueue();
    });
  </script>
</body>
</html>

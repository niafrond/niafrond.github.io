<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoké — Ajouter une chanson</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --panel-border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --panel-border: #e5e7eb;
        --text: #111827;
        --muted: #4b5563;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px 48px;
    }
    .home { max-width: 520px; margin: 0 auto; }
    h1 { margin: 8px 0 4px; font-size: 1.4rem; text-align: center; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); text-align: center; font-size: 0.9rem; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .search-bar-big {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 999px;
      padding: 6px 6px 6px 20px;
    }
    .search-bar-big:focus-within { border-color: var(--primary); }
    .search-bar-big input {
      flex: 1;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 1.05rem;
      padding: 12px 4px;
      min-width: 0;
    }
    .search-bar-big input:focus { outline: none; }
    .search-submit-btn { border-radius: 999px; padding: 12px 20px; white-space: nowrap; background: var(--primary); color: #06220f; }
    .search-submit-btn:hover { background: var(--primary-hover); }
    @media (max-width: 420px) {
      .search-bar-big { flex-wrap: wrap; border-radius: 20px; padding: 10px; }
      .search-bar-big input { width: 100%; padding: 8px 6px; }
      .search-submit-btn { width: 100%; }
    }
    .status { margin: 10px 0; color: var(--muted); font-size: 0.85rem; text-align: center; min-height: 1.1em; }
    .status.error { color: var(--danger); }

    .section { margin-top: 28px; }
    .results, .queue-list { display: grid; gap: 10px; }
    .item {
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: 76px 1fr auto;
      gap: 10px;
      align-items: center;
      background: var(--panel);
    }
    .item.current { border-color: var(--primary); }
    .thumb {
      width: 76px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      background: #000;
    }
    .meta h3 { margin: 0 0 2px; font-size: 0.9rem; line-height: 1.25; }
    .meta p { margin: 0; color: var(--muted); font-size: 0.78rem; }
    .badge-current { display: inline-block; margin-bottom: 3px; font-size: 0.7rem; font-weight: 700; color: var(--primary); }
    .add-btn, .remove-btn {
      color: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.78rem;
      white-space: nowrap;
      border: 0;
    }
    .add-btn { background: var(--primary); color: #06220f; }
    .add-btn:hover { background: var(--primary-hover); }
    .add-btn:disabled { background: #6b7280; color: #fff; cursor: default; }
    .remove-btn { background: var(--danger); }
    .remove-btn:hover { background: #dc2626; }
    .empty-hint { color: var(--muted); font-size: 0.88rem; }

    .my-requests { margin-top: 14px; display: grid; gap: 8px; }
    .request-item {
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
    }
    .request-text { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .request-state { white-space: nowrap; font-size: 0.8rem; }
    .request-state.pending { color: var(--muted); }
    .request-state.done { color: var(--primary); font-weight: 700; }
    .request-state.failed { color: var(--danger); font-weight: 700; }
    @media (max-width: 420px) {
      .item { grid-template-columns: 1fr; }
      .thumb { width: 100%; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="home">
    <h1>🎤 Ajoute une chanson</h1>
    <p class="subtitle">Recherche un titre, choisis la bonne vidéo, elle rejoint la file d'attente.</p>

    <form id="search-form">
      <div class="search-bar-big">
        <input id="query" type="text" placeholder="Titre - Artiste" autocomplete="off" autofocus>
        <button id="search-btn" class="search-submit-btn" type="submit">Rechercher</button>
      </div>
    </form>
    <p id="status" class="status"></p>
    <div id="results" class="results"></div>
    <div id="my-requests" class="my-requests"></div>

    <section class="section">
      <h2>🎶 File d'attente</h2>
      <div id="queue-list" class="queue-list"></div>
      <p id="queue-empty" class="empty-hint">File d'attente vide.</p>
    </section>
  </main>

  <script type="module">
    import {
      watchQueue,
      removeQueueItem,
      submitSearchQuery,
      watchSearchQuery,
      submitAddRequest,
      watchAddRequest,
    } from '/karaoke-playlist/karaoke-api.js';

    const searchForm = document.getElementById('search-form');
    const queryInput = document.getElementById('query');
    const searchBtn = document.getElementById('search-btn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const myRequestsEl = document.getElementById('my-requests');
    const queueListEl = document.getElementById('queue-list');
    const queueEmptyEl = document.getElementById('queue-empty');

    const sessionId = new URLSearchParams(location.search).get('session') || '';

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function formatDuration(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '';
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.round(totalSeconds % 60);
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function decodeHtmlEntities(str) {
      const el = document.createElement('textarea');
      el.innerHTML = str;
      return el.value;
    }

    // ── Recherche ────────────────────────────────────────────────────────
    function renderResults(results) {
      resultsEl.innerHTML = '';
      if (!results.length) {
        setStatus('Aucun résultat.');
        return;
      }
      setStatus(`${results.length} résultat(s) — choisis la bonne vidéo.`);
      const queryText = queryInput.value.trim();

      const fragment = document.createDocumentFragment();
      for (const result of results) {
        if (!result?.videoUrl) continue;
        const title = decodeHtmlEntities(result.videoTitle || 'Titre inconnu');
        const subtitle = decodeHtmlEntities(result.channelName || '');

        const card = document.createElement('article');
        card.className = 'item';
        const image = document.createElement('img');
        image.className = 'thumb';
        image.src = result.artworkUrl || '';
        image.alt = '';

        const meta = document.createElement('div');
        meta.className = 'meta';
        const titleEl = document.createElement('h3');
        titleEl.textContent = title;
        const subtitleEl = document.createElement('p');
        subtitleEl.textContent = [subtitle, formatDuration(result.durationSeconds)].filter(Boolean).join(' · ');
        meta.append(titleEl, subtitleEl);

        const addBtn = document.createElement('button');
        addBtn.className = 'add-btn';
        addBtn.type = 'button';
        addBtn.textContent = result.isLocal ? 'Ajouter' : 'Ajouter (télécharger)';
        addBtn.addEventListener('click', () => addResult(queryText, result, addBtn));

        card.append(image, meta, addBtn);
        fragment.appendChild(card);
      }
      resultsEl.appendChild(fragment);
    }

    let searchUnsubscribe = null;

    async function searchKaraoke() {
      if (!sessionId) {
        setStatus('QR code invalide ou expiré : demande un nouveau code à l’organisateur.', true);
        return;
      }
      const queryText = queryInput.value.trim();
      if (!queryText) {
        setStatus('Écris un titre de chanson.', true);
        return;
      }

      resultsEl.innerHTML = '';
      setStatus('Recherche en cours…');
      searchBtn.disabled = true;
      if (searchUnsubscribe) { searchUnsubscribe(); searchUnsubscribe = null; }

      try {
        const { requestId } = await submitSearchQuery(sessionId, queryText);
        searchUnsubscribe = watchSearchQuery(sessionId, requestId, (data) => {
          if (data.status === 'done') {
            renderResults(Array.isArray(data.results) ? data.results : []);
            searchBtn.disabled = false;
          } else if (data.status === 'failed') {
            setStatus(`Échec de la recherche (${data.message || 'erreur inconnue'}).`, true);
            searchBtn.disabled = false;
          }
          // 'pending'/'processing' : on laisse le message "Recherche en cours…".
        });
      } catch (error) {
        setStatus(`Échec de la recherche (${error.message || error}).`, true);
        searchBtn.disabled = false;
      }
    }

    // ── Ajout d'un résultat choisi ──────────────────────────────────────
    function addRequestRow(title, requestId) {
      const item = document.createElement('div');
      item.className = 'request-item';
      const textEl = document.createElement('span');
      textEl.className = 'request-text';
      textEl.textContent = title;
      const stateEl = document.createElement('span');
      stateEl.className = 'request-state pending';
      stateEl.textContent = '⏳ Ajout en cours…';
      item.append(textEl, stateEl);
      myRequestsEl.prepend(item);

      watchAddRequest(sessionId, requestId, (data) => {
        if (data.status === 'failed') {
          stateEl.textContent = '❌ Échec';
          stateEl.className = 'request-state failed';
          stateEl.title = data.message || '';
        } else if (data.status === 'done') {
          stateEl.textContent = '✅ Ajoutée';
          stateEl.className = 'request-state done';
        }
      });
    }

    async function addResult(queryText, result, addBtn) {
      addBtn.disabled = true;
      const originalLabel = addBtn.textContent;
      addBtn.textContent = 'Envoi…';
      try {
        const { requestId } = await submitAddRequest(sessionId, queryText, result);
        addRequestRow(decodeHtmlEntities(result.videoTitle || queryText), requestId);
      } catch (error) {
        setStatus(`Échec de l’ajout (${error.message || error}).`, true);
        addBtn.disabled = false;
        addBtn.textContent = originalLabel;
      }
    }

    // ── File d'attente (temps réel, visible par tout le monde) ──────────
    function renderQueue(items) {
      queueListEl.innerHTML = '';
      queueEmptyEl.style.display = items.length ? 'none' : 'block';

      const fragment = document.createDocumentFragment();
      items.forEach((track, index) => {
        const card = document.createElement('article');
        card.className = 'item' + (index === 0 ? ' current' : '');

        const image = document.createElement('img');
        image.className = 'thumb';
        image.src = track.thumb || '';
        image.alt = '';

        const meta = document.createElement('div');
        meta.className = 'meta';
        if (index === 0) {
          const badge = document.createElement('span');
          badge.className = 'badge-current';
          badge.textContent = '▶ EN COURS';
          meta.appendChild(badge);
        }
        const titleEl = document.createElement('h3');
        titleEl.textContent = track.title || 'Titre inconnu';
        const channelEl = document.createElement('p');
        channelEl.textContent = track.channel || '';
        meta.append(titleEl, channelEl);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.type = 'button';
        removeBtn.textContent = index === 0 ? 'Passer' : 'Retirer';
        removeBtn.addEventListener('click', () => removeQueueItem(sessionId, track.id));

        card.append(image, meta, removeBtn);
        fragment.appendChild(card);
      });
      queueListEl.appendChild(fragment);
    }

    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      searchKaraoke();
    });

    if (!sessionId) {
      setStatus('QR code invalide ou expiré : demande un nouveau code à l’organisateur.', true);
      queryInput.disabled = true;
      searchBtn.disabled = true;
    } else {
      watchQueue(sessionId, renderQueue);
    }
  </script>
</body>
</html>

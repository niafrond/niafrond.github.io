<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllDebrid → FDM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    h1 span.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#a78bfa; }
    label { display: block; font-size: .78rem; color: #94a3b8; margin-bottom: .4rem; letter-spacing: .04em; text-transform: uppercase; }
    input[type=text], input[type=password] {
      width: 100%;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: .9rem;
      padding: .65rem .85rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #7c3aed; }
    .field { margin-bottom: 1rem; }
    .row { display: flex; gap: .6rem; }
    button {
      flex: 1;
      padding: .7rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .08s;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #6d28d9; }
    .btn-secondary { background: #1f2937; color: #94a3b8; border: 1px solid #374151; }
    .btn-secondary:hover:not(:disabled) { background: #374151; color: #e2e8f0; }
    .status {
      margin-top: 1.2rem;
      padding: .8rem 1rem;
      border-radius: 8px;
      font-size: .85rem;
      display: none;
    }
    .status.info  { background: #1e3a5f; border: 1px solid #3b82f6; color: #93c5fd; display: block; }
    .status.ok    { background: #14532d; border: 1px solid #22c55e; color: #86efac; display: block; }
    .status.error { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; display: block; }
    .result-link {
      margin-top: .6rem;
      font-size: .75rem;
      word-break: break-all;
      color: #6ee7b7;
      opacity: .8;
    }
    .settings-toggle {
      font-size: .78rem;
      color: #6366f1;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .settings-panel { display: none; margin-bottom: 1rem; }
    .settings-panel.open { display: block; }
  </style>
</head>
<body>
<div class="card">
  <h1><span class="dot"></span> AllDebrid → FDM</h1>

  <span class="settings-toggle" id="settingsToggle">⚙ Clé API AllDebrid</span>
  <div class="settings-panel" id="settingsPanel">
    <div class="field">
      <label>API Key AllDebrid</label>
      <input type="password" id="apiKey" placeholder="Laissez vide si configurée dans .env" autocomplete="off">
    </div>
  </div>

  <div class="field">
    <label>Lien à télécharger</label>
    <input type="text" id="urlInput" placeholder="https://..." autofocus>
  </div>

  <div class="row">
    <button class="btn-primary" id="btnSend">Débride + Envoyer à FDM</button>
    <button class="btn-secondary" id="btnDebrid">Débride seulement</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  const urlInput = document.getElementById('urlInput');
  const status = document.getElementById('status');
  const btnSend = document.getElementById('btnSend');
  const btnDebrid = document.getElementById('btnDebrid');

  // Persist API key in localStorage
  apiKeyInput.value = localStorage.getItem('alldebrid_key') || '';
  apiKeyInput.addEventListener('change', () => {
    localStorage.setItem('alldebrid_key', apiKeyInput.value.trim());
  });

  document.getElementById('settingsToggle').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.toggle('open');
  });

  function setStatus(type, msg, extra) {
    status.className = `status ${type}`;
    status.innerHTML = msg + (extra ? `<div class="result-link">${extra}</div>` : '');
  }

  function setLoading(loading) {
    btnSend.disabled = loading;
    btnDebrid.disabled = loading;
  }

  async function callApi(endpoint) {
    const url = urlInput.value.trim();
    if (!url) { setStatus('error', 'Entrez un lien.'); return; }

    const apiKey = apiKeyInput.value.trim();
    setLoading(true);
    setStatus('info', 'En cours…');

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, apiKey: apiKey || undefined })
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        setStatus('error', `Erreur : ${data.error || 'Inconnue'}`);
      } else if (endpoint.includes('send')) {
        setStatus('ok', `✓ Envoyé à FDM${data.filename ? ' — ' + data.filename : ''}`, data.directLink);
        urlInput.value = '';
      } else {
        setStatus('ok', `✓ Lien débridé${data.filename ? ' — ' + data.filename : ''}`, data.link);
      }
    } catch (err) {
      setStatus('error', `Erreur réseau : ${err.message}`);
    } finally {
      setLoading(false);
    }
  }

  btnSend.addEventListener('click', () => callApi('/api/send'));
  btnDebrid.addEventListener('click', () => callApi('/api/debrid'));

  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') callApi('/api/send');
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DJ Mix · Relais</title>
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="relay.css">
</head>
<body>

  <!-- Overlay "appuyer pour démarrer" — AudioContext exige un geste utilisateur -->
  <div id="relay-tap-overlay" role="button" aria-label="Appuyer pour démarrer">
    <span class="tap-badge">📻 RELAIS</span>
    <span class="tap-hint">Appuyez pour démarrer</span>
    <span class="tap-sub">Lecture synchronisée avec le maître</span>
  </div>

  <!-- Écran relais -->
  <div id="relay-screen" class="relay-screen">
    <div class="relay-screen-header">
      <span class="relay-screen-badge">📻 Relais</span>
      <span id="relay-screen-status" class="relay-screen-status-text">Connexion…</span>
    </div>

    <button id="relay-search-btn" class="relay-search-btn" aria-label="Rechercher" title="Rechercher"></button>
    <button id="relay-fullscreen-btn" class="relay-fullscreen-btn" aria-label="Plein écran" title="Plein écran"></button>

    <div class="relay-screen-art-wrap">
      <img id="relay-screen-art" class="relay-screen-art" src="" alt="" hidden>
    </div>

    <div class="relay-screen-info">
      <div id="relay-screen-track" class="relay-screen-track">En attente du maître…</div>
      <div id="relay-screen-artist" class="relay-screen-artist"></div>
      <div id="relay-screen-meta" class="relay-screen-meta"></div>
    </div>

    <button id="relay-stream-btn" class="relay-stream-btn" aria-label="Lancer le flux" title="Lancer le flux"></button>

    <div class="relay-screen-progress-wrap">
      <div class="relay-screen-progress-bar"
           role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
           id="relay-screen-progress-bar">
        <div id="relay-screen-progress-fill" class="relay-screen-progress-fill"></div>
      </div>
      <div class="relay-screen-times">
        <span id="relay-screen-time-cur">0:00</span>
        <span id="relay-screen-time-total">0:00</span>
      </div>
    </div>

    <div id="relay-screen-next" class="relay-screen-next" hidden>
      <span class="relay-screen-next-label">Suivant</span>
      <div class="relay-screen-next-track">
        <img id="relay-screen-next-art" class="relay-screen-next-art" src="" alt="" hidden>
        <div class="relay-screen-next-info">
          <span id="relay-screen-next-name" class="relay-screen-next-name"></span>
          <span id="relay-screen-next-artist" class="relay-screen-next-artist"></span>
        </div>
      </div>
    </div>

    <!-- Indicateur de téléchargement en arrière-plan -->
    <div class="relay-screen-dl-wrap">
      <div class="relay-screen-dl-bar">
        <div id="relay-screen-dl-fill" class="relay-screen-dl-fill"></div>
      </div>
      <span id="relay-screen-dl-label"></span>
    </div>
  </div>

  <!-- Overlay recherche -->
  <div id="relay-search-overlay" class="relay-search-overlay" hidden>
    <div class="relay-search-header">
      <button id="relay-search-back" class="relay-search-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <input id="relay-search-input" class="relay-search-input" type="search" placeholder="Rechercher une chanson…" autocomplete="off" spellcheck="false">
      <button id="relay-search-clear" class="relay-search-clear" aria-label="Effacer" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="relay-search-results" class="relay-search-results"></div>
  </div>

  <!-- Action sheet (choix après sélection) -->
  <div id="relay-action-sheet" class="relay-action-sheet" hidden>
    <div class="relay-action-sheet-backdrop"></div>
    <div class="relay-action-sheet-content">
      <div class="relay-action-sheet-track">
        <img id="relay-action-art" class="relay-action-art" src="" alt="" hidden>
        <div class="relay-action-info">
          <div id="relay-action-name" class="relay-action-name"></div>
          <div id="relay-action-artist" class="relay-action-artist"></div>
        </div>
      </div>
      <div id="relay-action-waiting" class="relay-action-waiting" hidden>En attente du maître…</div>
      <button id="relay-action-play-now" class="relay-action-btn relay-action-btn--primary">Lire maintenant</button>
      <button id="relay-action-play-next" class="relay-action-btn relay-action-btn--secondary">Ajouter en suivant</button>
      <button id="relay-action-cancel" class="relay-action-btn relay-action-btn--cancel">Annuler</button>
    </div>
  </div>

  <!-- Toast relais -->
  <div id="relay-toast" class="relay-toast" hidden></div>

  <script type="module" src="relay.js"></script>
</body>
</html>

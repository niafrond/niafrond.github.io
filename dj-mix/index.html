<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DJ Mix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script>
    // Capture Spotify SDK ready event before SDK script runs
    window.spotifySDKReady = new Promise(resolve => {
      window.onSpotifyWebPlaybackSDKReady = resolve;
    });
  </script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</head>
<body>

  <!-- ── Setup Screen ────────────────────────────────────── -->
  <div id="setup-screen" class="screen active">
    <div class="setup-container">
      <div class="setup-logo">
        <div class="logo-icon">🎚️</div>
        <h1>DJ Mix</h1>
        <p class="setup-subtitle">Spotify Crossfade Player</p>
      </div>

      <button class="connect-btn" id="oauth-btn">Se connecter avec Spotify</button>

      <!-- Manual token fallback (advanced) -->
      <details class="manual-details">
        <summary>Token manuel (avancé)</summary>
        <div class="manual-body">
          <div class="form-group">
            <label for="token-input">Access Token Spotify</label>
            <input type="text" id="token-input" placeholder="Collez votre token ici" autocomplete="off" spellcheck="false">
          </div>
          <button class="connect-btn connect-btn--secondary" id="token-btn">Connecter</button>
        </div>
      </details>

      <!-- Hidden: kept for JS compatibility, values set by main.js -->
      <input type="hidden" id="client-id-input">
      <span id="redirect-uri-display" hidden></span>

      <div id="setup-error" class="error-msg" hidden></div>
      <div id="setup-loading" class="loading-msg" hidden>
        <span class="spinner"></span> Connexion en cours…
      </div>
    </div>
  </div>

  <!-- ── Main App Screen ────────────────────────────────── -->
  <div id="app-screen" class="screen" hidden>
    <!-- User header -->
    <div class="app-header">
      <div class="app-header-user">
        <img id="user-avatar" class="user-avatar" src="" alt="" hidden>
        <span id="user-name" class="user-name"></span>
      </div>
      <button id="logout-btn" class="logout-btn" title="Se déconnecter" aria-label="Déconnexion">↩ Déconnexion</button>
    </div>
    <!-- Search bar (sticky) -->
    <div class="search-bar">
      <div class="search-row">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="search" id="search-input" placeholder="Rechercher une chanson…" autocomplete="off">
          <button id="search-clear" class="search-clear" hidden aria-label="Effacer">✕</button>
        </div>
        <button id="playlist-btn" class="playlist-btn" aria-label="Charger une playlist" title="Mes playlists">📂</button>
      </div>
    </div>

    <!-- Search results overlay -->
    <div id="search-overlay" class="search-overlay" hidden>
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- Playlist picker overlay -->
    <div id="playlist-overlay" class="playlist-overlay" hidden>
      <div class="playlist-overlay-header">
        <h2 class="playlist-overlay-title">Mes playlists</h2>
        <div class="playlist-overlay-actions">
          <button id="playlist-logout-btn" class="logout-btn" title="Se déconnecter">↩ Déco</button>
          <button id="playlist-close-btn" class="overlay-close-btn">✕</button>
        </div>
      </div>
      <div id="playlist-list" class="playlist-list"></div>
    </div>

    <!-- Player -->
    <div class="player-section">

      <!-- Album art + track info -->
      <div class="now-playing">
        <div class="album-art-wrapper">
          <img id="album-art" src="" alt="" class="album-art" hidden>
          <div class="album-art-placeholder" id="art-placeholder">🎵</div>
          <div class="crossfade-ring" id="crossfade-ring" hidden></div>
        </div>
        <div class="track-info">
          <div id="track-name" class="track-name">Aucune chanson</div>
          <div id="track-artist" class="track-artist">Ajoutez des chansons à la file d'attente</div>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="progress-section">
        <div class="progress-bar-bg">
          <div class="crossfade-zone" id="crossfade-zone"></div>
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-labels">
          <span id="current-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <!-- Playback controls -->
      <div class="controls">
        <button class="ctrl-btn" id="prev-btn" title="Précédent" aria-label="Précédent">⏮</button>
        <button class="ctrl-btn play-btn" id="play-pause-btn" title="Play/Pause" aria-label="Play/Pause">
          <span id="play-icon">▶</span>
        </button>
        <button class="ctrl-btn fade-btn" id="next-btn" title="Crossfade vers le suivant" aria-label="Crossfade suivant">
          <span>⏭</span>
          <span class="fade-label">Fade</span>
        </button>
      </div>

      <!-- Crossfade duration slider -->
      <div class="crossfade-control">
        <div class="crossfade-row">
          <span class="fade-wave">〜〜</span>
          <span>Crossfade</span>
          <span id="crossfade-value" class="crossfade-value">5s</span>
        </div>
        <input type="range" id="crossfade-slider" min="1" max="15" value="5" class="fade-slider" aria-label="Durée du crossfade">
      </div>

    </div>

    <!-- Queue -->
    <div class="queue-section">
      <div class="queue-header">
        <h2 class="queue-title">File d'attente</h2>
        <button id="clear-queue-btn" class="clear-btn">Vider</button>
      </div>
      <div id="queue-list" class="queue-list">
        <div class="empty-queue" id="empty-queue">
          <div class="empty-icon">🎶</div>
          <p>Recherchez des chansons pour les ajouter</p>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1d33">
<title>Mon bus Naolib</title>
<script async src="https://stats.fontaine.one/count.js"></script>
<style>
:root{--bg:#0b1d33;--card:#13294a;--line:#25416b;--txt:#eef3fa;--mute:#93a7c4;--acc:#ffc83d;--ok:#4cd08a;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:18px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mute{color:var(--mute);font-size:14px}
.big{font-size:56px;font-weight:700;color:var(--acc);line-height:1.05;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,button{font:inherit;color:var(--txt);background:#0d2140;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=text],input[type=number],select{width:100%}
button{cursor:pointer}
button.p{background:var(--acc);color:#1b1500;border:0;font-weight:700}
button.g{background:none;border:0;color:var(--mute);padding:4px 8px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:8px;font-size:14px}.seg .on{background:var(--acc);color:#1b1500;border:0;font-weight:700}
.list{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.list div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.list div:last-child{border:0}.list div:hover{background:#1b3a66}
.err,.warn{color:var(--bad);font-size:14px}.warn{font-weight:600}
.alt{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.day{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.day:first-child{border:0}
.day .h{display:flex;justify-content:space-between;gap:8px}
.tag{font-size:12px;background:var(--acc);color:#1b1500;border-radius:6px;padding:1px 6px;margin-left:6px}
.edit{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wk{display:flex;align-items:center;gap:10px;margin:6px 0}.wk span{width:70px}
.hide{display:none}
.lr{display:flex;gap:10px;align-items:center;margin:0;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--txt);font-size:15px;cursor:pointer}
.lr input{width:auto}.lr b{min-width:42px}
.inc{background:#3a1f1f;border:1px solid var(--bad);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.inc.b{background:#5a1616}
</style>
</head>
<body>
<h1><span>🚌 Mon bus</span><button class="g hide" id="gear">⚙️ Réglages</button></h1>

<section id="pick" class="card hide">
  <b>Quelles lignes ?</b>
  <div class="mute">Coche les lignes que tu utilises (changements compris) : leurs horaires réels sont enregistrés sur cet appareil.</div>
  <input type="text" id="lq" placeholder="Filtrer (1, C3, Haluchère…)" autocomplete="off" style="margin-top:10px">
  <div class="list" id="lineList" style="max-height:340px"></div>
  <div class="mute" id="pickInfo" style="margin-top:8px"></div>
  <div class="err" id="perr"></div>
  <div class="row" style="margin-top:12px">
    <button class="g hide" id="pcancel">Annuler</button>
    <button class="p" id="pgo">Télécharger et continuer</button>
  </div>
</section>

<section id="main" class="hide">
  <div class="card" id="today"></div>
  <div class="card">
    <div class="seg"><button id="r5">5 jours à venir</button><button id="rnext">Semaine prochaine</button></div>
    <div id="days"></div>
    <div class="mute" style="margin-top:8px">Touche un jour pour changer son heure de début ou le mettre en repos (exception).</div>
  </div>
  <div class="mute" id="foot"></div>
</section>

<section id="setup" class="card hide">
  <div class="mute" id="stepno"></div>
  <div id="step1">
    <b>1 · Arrêt de départ</b>
    <div class="mute" id="mylines"></div>
    <button class="g" id="chg" style="padding-left:0">Modifier les lignes</button>
    <label>Arrêt de départ (parmi ceux de tes lignes)</label>
    <input type="text" id="q" placeholder="Taper pour filtrer…" autocomplete="off">
    <div class="list hide" id="stops"></div>
    <div class="mute" id="picked"></div>
    <label>Temps de marche maison → arrêt de départ (min)</label>
    <input type="number" id="walk" min="0" max="120" inputmode="numeric">
  </div>
  <div id="step2" class="hide">
    <b>2 · Arrêt d’arrivée</b>
    <div class="mute" id="lineRecap"></div>
    <label>Arrêt d’arrivée (un changement possible entre tes lignes)</label>
    <input type="text" id="q2" placeholder="Taper pour filtrer…" autocomplete="off">
    <div class="list hide" id="stops2"></div>
    <div class="mute" id="picked2"></div>
    <label>Temps de marche arrêt d’arrivée → travail (min)</label>
    <input type="number" id="walk2" min="0" max="120" inputmode="numeric">
    <label>Ma semaine habituelle</label>
    <div id="week"></div>
  </div>
  <div class="row" style="margin-top:16px">
    <button class="g" id="back">← Retour</button>
    <button class="p" id="next">Suivant →</button>
    <button class="p hide" id="save">Enregistrer</button>
    <button class="g" id="cancel">Annuler</button>
  </div>
  <div class="err" id="serr"></div>
</section>

<script>
// Données : GTFS officiel Naolib (data.nantesmetropole.fr) converti en fichiers statiques dans data/ (tools/build-data.mjs).
// Les lignes choisies sont copiées dans le localStorage (utilisable ensuite hors ligne). Stockage : localStorage uniquement.
const K = 'bus-naolib:v4';
const TR = 2;      // min de correspondance minimale
const PEN = 5;     // un trajet avec changement doit gagner au moins 5 min sur un direct pour être préféré
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hm = m => pad(Math.floor(m / 60) % 24) + ':' + pad(Math.round(m) % 60);
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const DOW = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const MONTH = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const dayLabel = d => DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MONTH[d.getMonth()];

const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const defWeek = () => { const w = {}; for (let i = 0; i < 7; i++) w[i] = { on: i >= 1 && i <= 5, start: '08:30' }; return w; };

// cfg : {lines:[ids], code, label, arrCode, arrLabel, walk, walk2, week:{0..6:{on,start}}}   (code = nom de l'arrêt)
let cfg = load(K + ':cfg', null);
let exc = load(K + ':exc', {});          // {'YYYY-MM-DD': {off:true} | {start:'HH:MM'}}
let range = 'five', editing = null;

(function purge() {
  const t = ymd(new Date());
  Object.keys(exc).forEach(d => { if (d < t) delete exc[d]; });
  save(K + ':exc', exc);
})();

/* ---------- Données : index, lignes copiées en localStorage ---------- */
async function jget(p) {
  const r = await fetch('data/' + p);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
let index = null;
const getIndex = () => index ? Promise.resolve(index) : jget('index.json').then(j => index = j);
const LD = {};   // id -> données de la ligne (en mémoire)
const ldKey = id => K + ':ld:' + id;
const getLD = id => LD[id] || (LD[id] = (load(ldKey(id), null) || {}).d || null);
const storedGen = id => (load(ldKey(id), null) || {}).gen;
// Télécharge les lignes et les range en localStorage ; efface les autres lignes déjà stockées
async function downloadLines(ids, progress) {
  const idx = await getIndex();
  try { Object.keys(localStorage).forEach(k => { if (k.startsWith(K + ':ld:') && !ids.includes(k.slice((K + ':ld:').length))) { localStorage.removeItem(k); delete LD[k.slice((K + ':ld:').length)]; } }); } catch {}
  let n = 0;
  for (const id of ids) {
    progress && progress(++n, ids.length, id);
    const d = await jget('l/' + encodeURIComponent(id) + '.json');
    try { localStorage.setItem(ldKey(id), JSON.stringify({ gen: idx.generated, d })); }
    catch { throw new Error('Espace de stockage plein : choisis moins de lignes.'); }
    LD[id] = d;
  }
}
// Au démarrage : récupère les lignes manquantes ou plus anciennes que le dernier jeu de données (silencieux si hors ligne)
async function syncLines() {
  if (!cfg) return;
  try {
    const idx = await getIndex();
    const todo = cfg.lines.filter(id => !getLD(id) || storedGen(id) < idx.generated);
    if (todo.length) await downloadLines(cfg.lines);
  } catch {}
}

/* ---------- Planification : trajet direct ou avec un changement ---------- */
const svcActive = (svc, date) => {
  const n = +date.replace(/-/g, ''), x = svc.x[n];
  if (x === 1) return true; if (x === 2) return false;
  return n >= svc.s && n <= svc.e && svc.d[new Date(date + 'T12:00:00').getDay()] === '1';
};
// Toutes les courses des lignes choisies ce jour-là : {line, head, st:[noms d'arrêts], tm:[minutes]}
function dayTrips(date) {
  const out = [];
  for (const id of cfg.lines) {
    const L = getLD(id); if (!L) throw new Error('ligne ' + id + ' absente');
    const act = L.svcs.map(sv => svcActive(sv, date));
    for (const t of L.trips) {
      if (!act[t[1]]) continue;
      const p = L.pats[t[2]], names = L.stops[t[0]], n = p.length / 2, st = new Array(n), tm = new Array(n);
      for (let i = 0; i < n; i++) { st[i] = names[p[2 * i]]; tm[i] = t[3] + p[2 * i + 1]; }
      out.push({ line: id, head: L.dirs[t[0]], st, tm });
    }
  }
  return out;
}
// Meilleurs trajets D → A : un par heure de départ utile, direct ou avec un changement
function plan(date, D, A) {
  const trips = dayTrips(date), toA = new Map();
  for (const tr of trips) {
    const j = tr.st.indexOf(A); if (j < 1) continue;
    for (let i = 0; i < j; i++) { const x = tr.st[i]; if (!toA.has(x)) toA.set(x, []); toA.get(x).push({ dep: tr.tm[i], arr: tr.tm[j], tr, i, j }); }
  }
  for (const l of toA.values()) {
    l.sort((a, b) => a.dep - b.dep);
    l.best = new Array(l.length); let b = null;
    for (let k = l.length - 1; k >= 0; k--) { if (!b || l[k].arr < b.arr) b = l[k]; l.best[k] = b; }
  }
  const first = (l, t) => { let lo = 0, hi = l.length; while (lo < hi) { const m = (lo + hi) >> 1; if (l[m].dep < t) lo = m + 1; else hi = m; } return lo; };
  const byDep = new Map();
  for (const tr of trips) {
    const i = tr.st.indexOf(D); if (i < 0 || i === tr.st.length - 1) continue;
    let best = null;
    const j = tr.st.indexOf(A);
    if (j > i) best = { arr: tr.tm[j], score: tr.tm[j], legs: [{ tr, i, j }] };
    for (let k = i + 1; k < (j > i ? j : tr.st.length); k++) {
      const l = toA.get(tr.st[k]); if (!l) continue;
      const q = first(l, tr.tm[k] + TR); if (q >= l.length) continue;
      const c = l.best[q]; if (c.tr === tr) continue;
      if (!best || c.arr + PEN < best.score) best = { arr: c.arr, score: c.arr + PEN, legs: [{ tr, i, j: k }, { tr: c.tr, i: c.i, j: c.j }] };
    }
    if (!best) continue;
    const dep = tr.tm[i], o = byDep.get(dep);
    if (!o || best.score < o.score) byDep.set(dep, { dep, arr: best.arr, score: best.score, legs: best.legs });
  }
  const all = [...byDep.values()].sort((a, b) => a.dep - b.dep), keep = [];
  let min = Infinity;
  for (let k = all.length - 1; k >= 0; k--) if (all[k].arr < min) { min = all[k].arr; keep.unshift(all[k]); }
  return keep;
}
function jdesc(j) {
  const [a, b] = j.legs, f = l => `ligne ${l.tr.line} → ${l.tr.head}`;
  return b ? `Ligne ${a.tr.line} → ${a.tr.head}, changement à ${a.tr.st[a.j]} (ligne ${b.tr.line} → ${b.tr.head}, départ ${hm(b.tr.tm[b.i])})`
    : `Ligne ${a.tr.line} → ${a.tr.head}`;
}

// Heure de début effective d'un jour (null si repos)
function startFor(date) {
  const e = exc[ymd(date)];
  if (e) return e.off ? null : e.start;
  const w = cfg.week[date.getDay()];
  return w && w.on ? w.start : null;
}
// Dernier départ dont l'arrivée + marche d'arrivée permet d'être à l'heure
function calc(c, start) {
  const target = toMin(start) - cfg.walk2;
  let best = null;
  c.times.forEach((t, k) => {
    const a = c.arrs[k];
    if (a != null && a <= target) best = { i: k, bus: t, arrive: a, leave: t - cfg.walk };
  });
  return best;
}

/* ---------- Écran principal ---------- */
const cache = {}; // date -> {times, arrs, js}|'err'
function ensure(date) {
  const d = ymd(date);
  if (cache[d]) return;
  try {
    const js = plan(d, cfg.code, cfg.arrCode);
    cache[d] = { times: js.map(j => j.dep), arrs: js.map(j => j.arr), js };
  } catch { cache[d] = 'err'; }
}
const ready = c => c && c !== 'wait';

// Jour affiché en haut : aujourd'hui, ou à partir de 9 h le prochain jour avec un bus (décalage en jours)
function focusDay(now) {
  if (now.getHours() < 9) return { d: now, off: 0 };
  for (let k = 1; k <= 7; k++) { const d = new Date(now); d.setDate(now.getDate() + k); if (startFor(d)) return { d, off: k }; }
  const d = new Date(now); d.setDate(now.getDate() + 1); return { d, off: 1 };
}
function renderToday() {
  if (!cfg || $('main').classList.contains('hide')) return;
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  const { d: fd, off } = focusDay(now), key = ymd(fd);
  const start = startFor(fd), box = $('today');
  const when = off === 0 ? 'aujourd’hui' : off === 1 ? 'demain' : dayLabel(fd);
  const head = `<div class="mute">${cfg.label} ⇒ ${cfg.arrLabel}</div>`;
  if (!start) { box.innerHTML = head + `<div style="font-size:22px;margin-top:6px">Pas de bus prévu ${when} 😌</div>`; return; }
  ensure(fd); const c = cache[key];
  if (c === 'err') { box.innerHTML = head + '<div class="warn">Horaires indisponibles : rouvre les réglages pour re-télécharger tes lignes.</div>'; return; }
  const r = calc(c, start);
  if (!r) { box.innerHTML = head + `<div class="warn">Aucun trajet ne t’amène à ${start} ${when}.</div>`; return; }
  const left = r.leave + off * 1440 - nowMin;
  const cd = left >= 1 ? `<span style="color:var(--ok)">dans ${left >= 60 ? Math.floor(left / 60) + ' h ' + pad(Math.floor(left % 60)) : Math.floor(left) + ' min'}</span>`
    : left > -1 ? '<span class="warn">maintenant !</span>'
    : `<span class="warn">déjà passé${-left < 60 ? ' (' + Math.ceil(-left) + ' min)' : ''}</span>`;
  let html = head + `<div class="mute" style="margin-top:6px">Pour arriver à ${start} ${when}${exc[key] ? ' (exception)' : ''}, sortir à</div>
    <div class="big">${hm(r.leave)}</div><div>${cd}</div><div class="mute" style="margin-top:8px">Départ ${hm(r.bus)} · arrivée à ${cfg.arrLabel} vers ${hm(r.arrive)}</div>
    <div class="mute">${jdesc(c.js[r.i])}</div>`;
  if (r.i > 0) html += `<div class="alt"><span>Départ d’avant : ${hm(c.times[r.i - 1])}</span><span>sortir à ${hm(c.times[r.i - 1] - cfg.walk)}</span></div>`;
  if (r.i + 1 < c.times.length) html += `<div class="alt"><span>Départ suivant : ${hm(c.times[r.i + 1])}</span><span>sortir à ${hm(c.times[r.i + 1] - cfg.walk)}</span></div>`;
  box.innerHTML = html;
}

function rangeDays() {
  const t = new Date(); t.setHours(12, 0, 0, 0);
  const out = [];
  if (range === 'five') for (let k = 1; k <= 5; k++) { const d = new Date(t); d.setDate(t.getDate() + k); out.push(d); }
  else {
    const mon = new Date(t); mon.setDate(t.getDate() + ((8 - t.getDay()) % 7 || 7));
    for (let k = 0; k < 7; k++) { const d = new Date(mon); d.setDate(mon.getDate() + k); out.push(d); }
  }
  return out;
}

function renderDays() {
  if (!cfg || $('main').classList.contains('hide')) return;
  $('r5').className = range === 'five' ? 'on' : ''; $('rnext').className = range === 'next' ? 'on' : '';
  const box = $('days'); box.innerHTML = '';
  rangeDays().forEach(d => {
    const key = ymd(d), start = startFor(d), e = exc[key];
    let right = '';
    if (!start) right = '<span class="mute">repos</span>';
    else {
      ensure(d); const c = cache[key];
      if (c === 'err') right = '<span class="warn">indisponible</span>';
      else { const r = calc(c, start); right = r ? `sortir à <b style="color:var(--acc)">${hm(r.leave)}</b> <span class="mute">(départ ${hm(r.bus)}${c.js[r.i].legs.length > 1 ? ', 1 changement' : ''})</span>` : '<span class="warn">pas de trajet</span>'; }
    }
    const el = document.createElement('div'); el.className = 'day';
    el.innerHTML = `<div class="h"><span>${dayLabel(d)}${start ? ' <span class="mute">· début ' + start + '</span>' : ''}${e ? '<span class="tag">exception</span>' : ''}</span><span>${right}</span></div>`;
    el.onclick = ev => { if (ev.target.closest('.edit')) return; editing = editing === key ? null : key; renderDays(); };
    if (editing === key) {
      const ed = document.createElement('div'); ed.className = 'edit';
      ed.innerHTML = `<input type="time" value="${start || cfg.week[d.getDay()].start}"><button class="p" data-a="set">Début décalé</button><button data-a="off">Repos</button>${e ? '<button class="g" data-a="clr">Rétablir</button>' : ''}`;
      ed.onclick = ev => {
        const a = ev.target.dataset.a; if (!a) return;
        if (a === 'set') { const v = ed.querySelector('input').value; if (!v) return; exc[key] = { start: v }; }
        if (a === 'off') exc[key] = { off: true };
        if (a === 'clr') delete exc[key];
        save(K + ':exc', exc); editing = null; renderDays(); renderToday();
      };
      el.appendChild(ed);
    }
    box.appendChild(el);
  });
}

function show(name) {
  ['pick', 'setup', 'main'].forEach(n => $(n).classList.toggle('hide', n !== name));
  $('gear').classList.toggle('hide', !(cfg && cfg.arrCode));
}
function showMain() {
  show('main');
  $('foot').textContent = `Lignes ${cfg.lines.join(', ')} · marche ${cfg.walk} min au départ, ${cfg.walk2} min à l’arrivée · horaires théoriques Naolib${index && index.validity ? ' (valables jusqu’au ' + index.validity.to.split('-').reverse().join('/') + ')' : ''}.`;
  renderToday(); renderDays();
}
$('r5').onclick = () => { range = 'five'; editing = null; renderDays(); };
$('rnext').onclick = () => { range = 'next'; editing = null; renderDays(); };

/* ---------- Choix des lignes ---------- */
let sel = new Set();
function renderLines() {
  const q = norm($('lq').value), box = $('lineList'); box.innerHTML = '';
  const hits = index.lines.filter(l => !q || norm(l.id + ' ' + l.name).includes(q));
  hits.forEach(l => {
    const row = document.createElement('label'); row.className = 'lr';
    row.innerHTML = `<input type="checkbox" ${sel.has(l.id) ? 'checked' : ''}><b style="color:#${l.color || 'fff'}">${l.id}</b><span>${l.name}</span>`;
    row.querySelector('input').onchange = e => { e.target.checked ? sel.add(l.id) : sel.delete(l.id); $('pickInfo').textContent = sel.size ? `${sel.size} ligne${sel.size > 1 ? 's' : ''} : ${[...sel].join(', ')}` : ''; };
    box.appendChild(row);
  });
  if (!hits.length) box.innerHTML = '<div class="mute" style="padding:9px 12px">Aucune ligne trouvée</div>';
}
async function openLines() {
  show('pick'); $('perr').textContent = ''; $('lq').value = '';
  sel = new Set(cfg ? cfg.lines : []);
  $('pcancel').classList.toggle('hide', !(cfg && cfg.arrCode));
  $('pickInfo').textContent = sel.size ? 'Lignes : ' + [...sel].join(', ') : '';
  $('lineList').innerHTML = '<div class="mute" style="padding:9px 12px">Chargement des lignes Naolib…</div>';
  try { await getIndex(); renderLines(); }
  catch { $('lineList').innerHTML = ''; $('perr').textContent = 'Liste des lignes Naolib indisponible : vérifie ta connexion et recharge la page.'; }
}
$('lq').oninput = () => index && renderLines();
$('pcancel').onclick = () => showMain();
$('pgo').onclick = async () => {
  if (!sel.size) { $('perr').textContent = 'Coche au moins une ligne.'; return; }
  const ids = [...sel].sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
  $('pgo').disabled = true; $('perr').textContent = '';
  try {
    await downloadLines(ids, (n, t, id) => { $('pickInfo').textContent = `Téléchargement ${n}/${t} : ligne ${id}…`; });
    const keep = cfg && ids.join() === cfg.lines.join();
    cfg = keep ? cfg : { lines: ids, week: cfg ? cfg.week : defWeek(), walk: cfg ? cfg.walk : 5, walk2: cfg ? cfg.walk2 : 5 };
    if (!keep) { delete cfg.code; delete cfg.arrCode; save(K + ':cfg', cfg); }
    openSetup();
  } catch (e) { $('perr').textContent = e.message && e.message.startsWith('Espace') ? e.message : 'Téléchargement impossible, réessaie.'; $('pickInfo').textContent = ''; }
  $('pgo').disabled = false;
};

/* ---------- Réglages : arrêts, marche, semaine ---------- */
let draft = {};
const allStops = () => [...new Set(cfg.lines.flatMap(id => { const L = getLD(id); return L ? [...L.stops[0], ...L.stops[1]] : []; }))]
  .sort((a, b) => a.localeCompare(b, 'fr'));

function weekUI(week) {
  $('week').innerHTML = WEEK_ORDER.map(i => `<div class="wk"><input type="checkbox" id="wo${i}" ${week[i].on ? 'checked' : ''}><span>${DOW[i]}</span><input type="time" id="ws${i}" value="${week[i].start}"></div>`).join('');
}
function pickedUI() {
  $('picked').textContent = draft.code ? '✔ ' + draft.label : 'Aucun arrêt choisi';
  $('picked2').textContent = draft.arrCode ? '✔ ' + draft.arrLabel : 'Aucun arrêt choisi';
}
function step(n) {
  $('step1').classList.toggle('hide', n !== 1); $('step2').classList.toggle('hide', n !== 2);
  $('next').classList.toggle('hide', n !== 1); $('save').classList.toggle('hide', n !== 2);
  $('back').classList.toggle('hide', n !== 2); $('stepno').textContent = 'Étape ' + n + ' sur 2';
  $('serr').textContent = '';
  if (n === 2) $('lineRecap').textContent = `Départ : ${draft.label} · lignes ${cfg.lines.join(', ')}`;
}
function openSetup() {
  show('setup');
  draft = { code: cfg.code, label: cfg.code, arrCode: cfg.arrCode, arrLabel: cfg.arrCode };
  $('q').value = ''; $('q2').value = ''; $('stops').classList.add('hide'); $('stops2').classList.add('hide');
  $('walk').value = cfg.walk; $('walk2').value = cfg.walk2;
  $('mylines').textContent = 'Lignes : ' + cfg.lines.join(', ');
  weekUI(cfg.week);
  $('cancel').classList.toggle('hide', !cfg.arrCode);
  pickedUI(); step(1);
}
// Liste filtrable des arrêts des lignes choisies ; pick(nom) est appelé au choix
function stopPicker(inputId, boxId, pick, not) {
  const input = $(inputId), box = $(boxId);
  const showList = () => {
    const q = norm(input.value);
    const hits = allStops().filter(n => n !== not() && (!q || norm(n).includes(q)));
    box.innerHTML = '';
    hits.slice(0, 60).forEach(n => {
      const d = document.createElement('div'); d.textContent = n;
      d.onclick = () => { pick(n); box.classList.add('hide'); input.value = ''; pickedUI(); };
      box.appendChild(d);
    });
    if (!hits.length) box.innerHTML = '<div class="mute">Aucun arrêt trouvé</div>';
    box.classList.remove('hide');
  };
  input.oninput = showList; input.onfocus = showList;
}
stopPicker('q', 'stops', n => { draft.code = n; draft.label = n; }, () => draft.arrCode);
stopPicker('q2', 'stops2', n => { draft.arrCode = n; draft.arrLabel = n; }, () => draft.code);
$('chg').onclick = openLines;

$('next').onclick = () => {
  const walk = parseInt($('walk').value, 10);
  if (!draft.code) { $('serr').textContent = 'Choisis ton arrêt de départ dans la liste.'; return; }
  if (isNaN(walk)) { $('serr').textContent = 'Renseigne le temps de marche.'; return; }
  draft.walk = walk;
  step(2);
};
$('back').onclick = () => step(1);

$('save').onclick = () => {
  const walk2 = parseInt($('walk2').value, 10);
  if (!draft.arrCode) { $('serr').textContent = 'Choisis ton arrêt d’arrivée dans la liste.'; return; }
  if (isNaN(walk2)) { $('serr').textContent = 'Renseigne le temps de marche à l’arrivée.'; return; }
  const week = {};
  for (let i = 0; i < 7; i++) week[i] = { on: $('wo' + i).checked, start: $('ws' + i).value || '08:30' };
  const next = { lines: cfg.lines, code: draft.code, label: draft.label, arrCode: draft.arrCode, arrLabel: draft.arrLabel, walk: draft.walk, walk2, week };
  // Vérifie qu'un trajet (direct ou avec un changement) existe sur les 7 prochains jours
  const old = cfg; cfg = next; let ok = false;
  try { for (let k = 0; k < 7 && !ok; k++) { const d = new Date(); d.setDate(d.getDate() + k); ok = plan(ymd(d), next.code, next.arrCode).length > 0; } } catch {}
  if (!ok) { cfg = old; $('serr').textContent = 'Aucun trajet trouvé entre ces deux arrêts avec tes lignes (un seul changement possible). Ajoute une ligne ou change d’arrêt.'; return; }
  save(K + ':cfg', cfg);
  for (const k in cache) delete cache[k];
  showMain();
};
$('cancel').onclick = () => showMain();
$('gear').onclick = () => { if (cfg) openSetup(); };

(async () => {
  await syncLines();
  if (cfg && cfg.arrCode && cfg.lines.every(getLD)) showMain(); else if (cfg && cfg.lines.every(getLD)) openSetup(); else openLines();
})();
setInterval(() => { if (cfg && !$('main').classList.contains('hide')) renderToday(); }, 15000);
</script>
</body>

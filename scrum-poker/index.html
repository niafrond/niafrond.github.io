<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrum Poker 🃏</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════════
     SCREEN : HOME
     ══════════════════════════════════════════════════════════════════════════ -->
<div id="screen-home" class="screen screen-center" hidden>
  <div class="app-title">🃏 Scrum Poker</div>
  <p class="app-subtitle">Planning poker P2P —<br>partagez juste un lien !</p>
  <button id="btn-create" class="btn btn-primary btn-lg">Créer une partie</button>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════
     SCREEN : CREATE (host enters name)
     ══════════════════════════════════════════════════════════════════════════ -->
<div id="screen-create" class="screen screen-center" hidden>
  <div class="app-title">🃏 Scrum Poker</div>
  <p class="app-subtitle">Créer une partie</p>
  <div class="form-card">
    <div class="form-group">
      <label for="create-name">Votre nom</label>
      <input id="create-name" class="input" type="text" maxlength="30"
        placeholder="Votre prénom ou pseudo" autocomplete="off">
    </div>
    <button id="btn-start-host" class="btn btn-primary">Créer la salle →</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════
     SCREEN : JOIN (client enters name)
     ══════════════════════════════════════════════════════════════════════════ -->
<div id="screen-join" class="screen screen-center" hidden>
  <div class="app-title">🃏 Scrum Poker</div>
  <p class="app-subtitle">Rejoindre la partie</p>
  <div class="form-card">
    <div class="form-group">
      <label for="join-name">Votre nom</label>
      <input id="join-name" class="input" type="text" maxlength="30"
        placeholder="Votre prénom ou pseudo" autocomplete="off">
    </div>
    <button id="btn-join" class="btn btn-primary">Rejoindre →</button>
    <div id="join-error" class="error-banner" hidden></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════
     SCREEN : CONNECTING
     ══════════════════════════════════════════════════════════════════════════ -->
<div id="screen-connecting" class="screen screen-center" hidden>
  <div class="app-title">🃏</div>
  <p class="app-subtitle">Connexion en cours…</p>
  <div class="spinner"></div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════
     SCREEN : GAME
     ══════════════════════════════════════════════════════════════════════════ -->
<div id="screen-game" class="screen" hidden>

  <!-- Reconnect banner (hidden by default) -->
  <div id="reconnect-banner" hidden>⚠️ Reconnexion au serveur…</div>

  <!-- Header -->
  <header class="game-header">
    <div class="app-title-sm">🃏 Scrum Poker</div>
    <div id="my-name-badge" class="player-badge"></div>
  </header>

  <!-- Story -->
  <div class="section-card">
    <div class="section-label">📌 User story / Tâche</div>
    <textarea id="story-input" class="story-textarea"
      placeholder="Décrivez la tâche à estimer…" rows="2" readonly></textarea>
    <div id="story-actions" class="story-actions" hidden>
      <button id="btn-save-story" class="btn btn-sm btn-primary">✔ Définir</button>
    </div>
  </div>

  <!-- Share link (host only) -->
  <div id="share-section" class="section-card" hidden>
    <div class="section-label">🔗 Lien d'invitation</div>
    <div class="share-row">
      <input id="share-link" class="share-input" type="text" readonly>
      <button id="btn-copy-link" class="btn btn-sm btn-secondary">📋 Copier</button>
    </div>
  </div>

  <!-- Players -->
  <div class="section-card">
    <div class="section-label">👥 Participants</div>
    <div id="players-list" class="players-list"></div>
  </div>

  <!-- Voting cards -->
  <div id="cards-section" class="section-card">
    <div class="section-label">🎴 Votre estimation</div>
    <div id="cards-grid" class="cards-grid"></div>
  </div>

  <!-- Reveal results (hidden until reveal) -->
  <div id="reveal-section" class="section-card" hidden>
    <div class="section-label">📊 Résultats</div>
    <div id="reveal-results" class="reveal-results"></div>
    <div id="reveal-summary" class="reveal-summary"></div>
  </div>

  <!-- Bottom actions bar -->
  <div class="actions-bar">
    <button id="btn-reveal" class="btn btn-primary" hidden>🃏 Révéler</button>
    <button id="btn-reset" class="btn btn-secondary" hidden>🔄 Nouvelle mise</button>
  </div>

</div>

<script type="module" src="main.js"></script>
</body>
</html>
